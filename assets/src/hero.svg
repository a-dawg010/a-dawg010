<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" role="img" aria-label="Ameya, AI engineer. I build agents that know when they are guessing.">
<style>
__FONTS__
__VARS__
.paper{fill:var(--paper)}
.eyebrow{font:500 11px var(--mono);fill:var(--dim);letter-spacing:2.4px}
.eyebrow tspan.n{fill:var(--ink)}
.corner{font:500 10.5px var(--mono);fill:var(--faint);letter-spacing:1.9px}
.h{font:800 60px var(--disp);fill:var(--ink);letter-spacing:-2.2px}
.h.on{fill:var(--ytext)}
.sub{font:500 15.5px var(--body);fill:var(--dim);letter-spacing:-.1px}
.caw{font:italic 400 21px var(--serif);fill:var(--ink)}
.floor{stroke:var(--rule);stroke-width:1}
.crumb{fill:var(--rule2)}
.bird{fill:var(--ink)}
.legs{stroke:var(--ink);stroke-width:2.5;stroke-linecap:round;fill:none}
.toes{stroke:var(--ink);stroke-width:1.8;stroke-linecap:round;fill:none}
.wing{stroke:var(--paper);stroke-width:1.2;fill:none;opacity:.34;stroke-linecap:round}
.eye{fill:var(--paper)}
</style>
<defs>
  <path id="hop" d="M-40,366 q14,-17 28,0 q14,-17 28,0 q14,-17 28,0 q14,-17 28,0 q14,-17 28,0 q14,-17 28,0 q14,-17 28,0 q14,-17 28,0 q14,-17 28,0 q14,-17 28,0 q14,-17 28,0 q14,-17 28,0 q14,-17 28,0 q14,-17 28,0 q14,-17 28,0 q14,-17 28,0 q14,-17 28,0 q14,-17 28,0 q14,-17 28,0 q14,-17 28,0 q14,-17 28,0 q14,-17 28,0 q14,-17 28,0 q14,-17 28,0 q14,-17 28,0 q14,-17 28,0 q14,-17 28,0 q14,-17 28,0 q14,-17 28,0 q14,-17 28,0 q14,-17 28,0 q14,-17 28,0 q14,-17 28,0 q14,-17 28,0"/>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
  </filter>
</defs>

<rect class="paper" width="880" height="400"/>
<rect width="880" height="400" filter="url(#grain)" opacity="var(--grain)"/>

<rect x="44" y="40" width="9" height="9" fill="var(--yellow)"/>
<text class="eyebrow" x="64" y="48"><tspan class="n">AMEYA</tspan>   AI ENGINEER   MULTI-AGENT SYSTEMS</text>
<text class="corner" x="836" y="48" text-anchor="end">A-DAWG010.GITHUB.IO  ↗</text>

<text class="h" x="42" y="142">I build agents that</text>
<text class="h" x="42" y="204">know when they’re</text>
<g transform="rotate(-0.7 44 244)">
  <rect x="34" y="220" width="292" height="50" rx="3" fill="var(--yellow)"/>
  <text class="h on" x="42" y="260">guessing.</text>
</g>

<text class="sub" x="44" y="308">Orchestration you can audit. Retrieval that understands relationships.</text>
<text class="sub" x="44" y="330">Built where a confident wrong answer becomes somebody’s audit finding.</text>

<line class="floor" x1="42" y1="366" x2="838" y2="366"/>

<g>
  <rect class="crumb" x="546" y="360" width="6" height="6" rx="1.5">
    <animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" values="1;1;0;0;1;1" keyTimes="0;0.457;0.468;0.95;0.965;1"/>
  </rect>
  <rect class="crumb" x="560" y="360" width="6" height="6" rx="1.5">
    <animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" values="1;1;0;0;1;1" keyTimes="0;0.517;0.528;0.95;0.965;1"/>
  </rect>
  <rect class="crumb" x="572" y="360" width="6" height="6" rx="1.5">
    <animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" values="1;1;0;0;1;1" keyTimes="0;0.577;0.588;0.95;0.965;1"/>
  </rect>
</g>

<text class="caw" x="622" y="340" opacity="0">caw.
  <animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" values="0;0;1;1;0;0" keyTimes="0;0.60;0.635;0.71;0.76;1"/>
  <animate attributeName="y" dur="16s" repeatCount="indefinite" calcMode="linear" values="344;344;336;334;334;344" keyTimes="0;0.60;0.65;0.71;0.76;1"/>
</text>

<g>
  <animateMotion dur="16s" repeatCount="indefinite" calcMode="linear"
    keyPoints="0;0;0.588;0.618;1;1" keyTimes="0;0.04;0.42;0.60;0.92;1"><mpath href="#hop"/></animateMotion>
  <g transform="scale(0.55)">
    <animateTransform attributeName="transform" type="rotate" additive="sum" dur="16s" repeatCount="indefinite"
      calcMode="linear" values="0 4 0;0 4 0;22 4 0;0 4 0;22 4 0;0 4 0;22 4 0;0 4 0;0 4 0"
      keyTimes="0;0.44;0.457;0.478;0.517;0.538;0.577;0.598;1"/>
    <path class="legs" d="M1,-13 L0,-2 M8,-13 L7,-2"/>
    <path class="toes" d="M-4,-0.7 L0,-2.2 L5.6,-0.7 M0,-2.2 L-2.6,0.2"/>
    <path class="toes" d="M3,-0.7 L7,-2.2 L12.6,-0.7 M7,-2.2 L4.4,0.2"/>
    <path class="bird" d="M-4,-28 L-48,-13 L-45,-5 L-2,-13 Z"/>
    <ellipse class="bird" cx="0" cy="-22" rx="18" ry="11" transform="rotate(-12 0 -22)"/>
    <path class="bird" d="M2,-26 C4,-38 13,-46 22,-45 C30,-44 34,-38 33,-32 C32,-27 26,-24 19,-25 C11,-26 5,-24 2,-26 Z"/>
    <path class="bird" d="M31,-39.5 C37,-38.6 44,-36 48,-33.6 C43.6,-31.2 36,-30.4 30.4,-31.2 Z"/>
    <path class="wing" d="M-14,-21 C-4,-25 8,-26 15,-25"/>
    <circle class="eye" cx="26" cy="-37.5" r="1.6"/>
  </g>
</g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="880" height="460" role="img" aria-label="AMEYA — builds agents that know when they're guessing. Now broadcasting three channels: assay, shelfmark and inference.">
<style>
__FONTS__
__VARS__
.paper{fill:var(--paper)}
.bar{font:500 9.5px var(--mono);fill:var(--faint);letter-spacing:1.8px}
.bar.on{fill:var(--ink)}
.word{font:900 168.6px var(--disp);letter-spacing:-5px}
.sub{font:500 25px var(--body);fill:var(--ink);letter-spacing:-.3px}
.ser{font:italic 400 31px var(--serif);fill:var(--atext)}
.g{stroke:var(--rule);stroke-width:1;stroke-dasharray:1 3}
.frame{stroke:var(--rule2);stroke-width:1}
.trace{fill:none;stroke:var(--trace);stroke-width:1.6;stroke-linejoin:round}
.lab{font:500 8.5px var(--mono);fill:var(--faint);letter-spacing:1.6px}
.ch{font:500 9px var(--mono);fill:var(--atext);letter-spacing:1.4px}
.chn{font:900 15px var(--disp);fill:var(--ink);letter-spacing:-.2px}
.chd{font:italic 400 15px var(--serif);fill:var(--dim)}
</style>
<defs>
  <pattern id="scan" width="4" height="3" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#000"/></pattern>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
  </filter>
  <filter id="tear" x="-5%" y="-20%" width="110%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency="0.001 0.28" numOctaves="1" seed="4" result="n">
      <animate attributeName="seed" dur="0.24s" repeatCount="indefinite" calcMode="discrete" values="4;11;2;17;8"/>
    </feTurbulence>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="0" xChannelSelector="R" yChannelSelector="G">
      <animate attributeName="scale" dur="8s" repeatCount="indefinite" calcMode="linear"
        values="0;0;46;6;30;0;0;22;0;0" keyTimes="0;0.62;0.628;0.64;0.652;0.668;0.86;0.866;0.874;1"/>
    </feDisplacementMap>
  </filter>
  <clipPath id="scope"><rect x="36" y="304" width="808" height="88"/></clipPath>
</defs>

<rect class="paper" width="880" height="460"/>
<rect width="880" height="460" filter="url(#grain)" opacity="var(--grain)"/>

<!-- top bar -->
<circle cx="40" cy="34" r="4" fill="var(--hot)">
  <animate attributeName="opacity" dur="1.6s" repeatCount="indefinite" calcMode="discrete" values="1;.15" keyTimes="0;.62"/>
</circle>
<text class="bar on" x="52" y="37.5">ON AIR</text>
<text class="bar" x="440" y="37.5" text-anchor="middle">TRANSMITTING SINCE 2023</text>
<text class="bar" x="844" y="37.5" text-anchor="end">A-DAWG010.GITHUB.IO ↗</text>
<line class="frame" x1="36" y1="52" x2="844" y2="52"/>

<!-- wordmark: two chromatic ghosts that only surface when the signal tears -->
<g filter="url(#tear)">
  <text class="word" x="33" y="212" fill="var(--acid)" opacity="0">AMEYA
    <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="discrete" values="0;1;0;1;0" keyTimes="0;0.62;0.668;0.86;0.874"/>
    <animate attributeName="x" dur="0.12s" repeatCount="indefinite" calcMode="discrete" values="31;35;29"/>
  </text>
  <text class="word" x="39" y="212" fill="var(--hot)" opacity="0">AMEYA
    <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="discrete" values="0;1;0;1;0" keyTimes="0;0.62;0.668;0.86;0.874"/>
    <animate attributeName="x" dur="0.12s" repeatCount="indefinite" calcMode="discrete" values="41;38;43"/>
  </text>
  <text class="word" x="36" y="212" fill="var(--ink)">AMEYA</text>
</g>

<!-- subline -->
<text class="sub" x="38" y="266">builds agents that know when they’re </text>
<g transform="rotate(-1.2 451.4 256)">
  <rect x="445.4" y="239" width="116.0" height="36" fill="var(--acid)"/>
  <text class="ser" x="452.4" y="267">guessing.</text>
</g>


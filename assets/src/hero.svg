<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" role="img" aria-label="Ameya Panse, AI engineer in Pune. I build agents that know when they are guessing.">
<style>
__FONTS__
__VARS__
.paper{fill:var(--paper)}
.eyebrow{font:500 11px var(--mono);fill:var(--dim);letter-spacing:2.4px}
.eyebrow tspan.n{fill:var(--ink)}
.corner{font:500 10.5px var(--mono);fill:var(--faint);letter-spacing:1.9px}
.h{font:800 60px var(--disp);fill:var(--ink);letter-spacing:-2.2px}
.h.on{fill:var(--ytext)}
.sub{font:500 15.5px var(--body);fill:var(--dim);letter-spacing:-.1px}
.nom{font:italic 400 21px var(--serif);fill:var(--ink)}
.floor{stroke:var(--rule);stroke-width:1}
.crumb{fill:var(--rule2)}
.seg{fill:var(--ink)}
.eye{fill:var(--paper)}
</style>
<defs>
  <path id="walk" d="M-14,366 H894"/>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
  </filter>
</defs>

<rect class="paper" width="880" height="400"/>
<rect width="880" height="400" filter="url(#grain)" opacity="var(--grain)"/>

<rect x="44" y="40" width="9" height="9" fill="var(--yellow)"/>
<text class="eyebrow" x="64" y="48"><tspan class="n">AMEYA PANSE</tspan>   AI ENGINEER   PUNE, IN</text>
<text class="corner" x="836" y="48" text-anchor="end">A-DAWG010.GITHUB.IO  ↗</text>

<text class="h" x="42" y="142">I build agents that</text>
<text class="h" x="42" y="204">know when they’re</text>
<g transform="rotate(-0.7 44 244)">
  <rect x="34" y="220" width="292" height="50" rx="3" fill="var(--yellow)"/>
  <text class="h on" x="42" y="260">guessing.</text>
</g>

<text class="sub" x="44" y="308">Orchestration you can audit. Retrieval that understands relationships.</text>
<text class="sub" x="44" y="330">Built where a confident wrong answer becomes somebody’s audit finding.</text>

<!-- the floor, and its resident -->
<line class="floor" x1="42" y1="366" x2="838" y2="366"/>

<g>
  <rect class="crumb" x="518" y="360" width="6" height="6" rx="1.5">
    <animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" values="1;1;0;0;1;1" keyTimes="0;0.385;0.405;0.95;0.965;1"/>
    <animate attributeName="y" dur="16s" repeatCount="indefinite" calcMode="linear" values="360;360;352;352;360;360" keyTimes="0;0.385;0.405;0.95;0.965;1"/>
  </rect>
  <rect class="crumb" x="534" y="360" width="6" height="6" rx="1.5">
    <animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" values="1;1;0;0;1;1" keyTimes="0;0.435;0.455;0.95;0.965;1"/>
    <animate attributeName="y" dur="16s" repeatCount="indefinite" calcMode="linear" values="360;360;352;352;360;360" keyTimes="0;0.435;0.455;0.95;0.965;1"/>
  </rect>
  <rect class="crumb" x="550" y="360" width="6" height="6" rx="1.5">
    <animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" values="1;1;0;0;1;1" keyTimes="0;0.485;0.505;0.95;0.965;1"/>
    <animate attributeName="y" dur="16s" repeatCount="indefinite" calcMode="linear" values="360;360;352;352;360;360" keyTimes="0;0.485;0.505;0.95;0.965;1"/>
  </rect>
  <rect class="crumb" x="566" y="360" width="6" height="6" rx="1.5">
    <animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" values="1;1;0;0;1;1" keyTimes="0;0.535;0.555;0.95;0.965;1"/>
    <animate attributeName="y" dur="16s" repeatCount="indefinite" calcMode="linear" values="360;360;352;352;360;360" keyTimes="0;0.535;0.555;0.95;0.965;1"/>
  </rect>
</g>

<text class="nom" x="604" y="358" opacity="0">nom.
  <animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" values="0;0;1;1;0;0" keyTimes="0;0.5;0.53;0.63;0.68;1"/>
  <animate attributeName="y" dur="16s" repeatCount="indefinite" calcMode="linear" values="362;362;354;352;352;362" keyTimes="0;0.5;0.545;0.63;0.68;1"/>
</text>

<g>
  <g><animateMotion dur="16s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;0.596;0.662;1;1" keyTimes="0;0.03;0.36;0.56;0.90;1"><mpath href="#walk"/></animateMotion>
     <circle class="seg" cx="-19" cy="-7" r="3"><animate attributeName="cy" dur=".55s" repeatCount="indefinite" values="-7;-9.5;-7" keyTimes="0;.5;1"/></circle></g>
  <g><animateMotion dur="16s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;0.596;0.662;1;1" keyTimes="0;0.0245;0.3545;0.5545;0.8945;1"><mpath href="#walk"/></animateMotion>
     <circle class="seg" cx="-14" cy="-7.5" r="3.7"><animate attributeName="cy" dur=".55s" repeatCount="indefinite" begin="-.09s" values="-7.5;-10;-7.5" keyTimes="0;.5;1"/></circle></g>
  <g><animateMotion dur="16s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;0.596;0.662;1;1" keyTimes="0;0.019;0.349;0.549;0.889;1"><mpath href="#walk"/></animateMotion>
     <circle class="seg" cx="-9" cy="-8" r="4.4"><animate attributeName="cy" dur=".55s" repeatCount="indefinite" begin="-.18s" values="-8;-10.5;-8" keyTimes="0;.5;1"/></circle></g>
  <g><animateMotion dur="16s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;0.596;0.662;1;1" keyTimes="0;0.0135;0.3435;0.5435;0.8835;1"><mpath href="#walk"/></animateMotion>
     <circle class="seg" cx="-3.5" cy="-8.4" r="5.1"><animate attributeName="cy" dur=".55s" repeatCount="indefinite" begin="-.27s" values="-8.4;-10.9;-8.4" keyTimes="0;.5;1"/></circle></g>
  <g><animateMotion dur="16s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;0.596;0.662;1;1" keyTimes="0;0.008;0.338;0.538;0.878;1"><mpath href="#walk"/></animateMotion>
     <g><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" values="1;1;1;1" keyTimes="0;0.3;0.6;1"/>
       <circle class="seg" cx="3" cy="-8.8" r="5.8"><animate attributeName="cy" dur=".55s" repeatCount="indefinite" begin="-.36s" values="-8.8;-11.3;-8.8" keyTimes="0;.5;1"/></circle>
       <circle class="eye" cx="4.6" cy="-10.4" r="1.15"><animate attributeName="cy" dur=".55s" repeatCount="indefinite" begin="-.36s" values="-10.4;-12.9;-10.4" keyTimes="0;.5;1"/></circle>
       <circle class="eye" cx="6.9" cy="-8.4" r="1.15"><animate attributeName="cy" dur=".55s" repeatCount="indefinite" begin="-.36s" values="-8.4;-10.9;-8.4" keyTimes="0;.5;1"/></circle>
     </g></g>
</g>
</svg>

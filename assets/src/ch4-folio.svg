  <path d="M772.3,122 l6.6,20 M778.9,122 l-6.6,20" stroke="var(--paper)" stroke-width="1.6"/>
  <text class="lab" x="776.9" y="162" text-anchor="middle" style="fill:var(--hot)">BLOCKED</text>
</g>
<text class="lab" x="478" y="162">RETRIEVABLE</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" role="img" aria-label="Channel 01, threebody: finds every AI-agent session on your machine where untrusted input, private data and a way out meet with nobody asking first, and prints the attack back as one sentence, scored with ISO/SAE 21434.">

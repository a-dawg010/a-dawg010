<rect x="14.5" y="10.5" width="62" height="26" fill="var(--acid)"/>
<text class="ch" x="24" y="27.5">CH.01</text>
<text class="stack" x="844" y="27" text-anchor="end">PYTHON 3.11  ·  ZERO DEPENDENCIES  ·  NEVER ONLINE</text>
<line class="rule" x1="14.5" y1="36.5" x2="865.5" y2="36.5"/>

<text class="name" x="34" y="104">threebody</text>
<text class="tag" x="36" y="138">three capabilities, one bad afternoon.</text>
<rect x="36" y="146" width="198" height="2" fill="var(--acid)"/>
<text class="body" x="36" y="176">Finds the AI-agent sessions on your machine where</text>
<text class="body" x="36" y="195">untrusted input, private data and a way out all meet</text>
<text class="body" x="36" y="214">with nobody asking first, then prints the attack back</text>
<text class="body" x="36" y="233">to you as one sentence. Offline, read-only, no deps.</text>
<text class="link" x="36" y="264">GITHUB.COM/A-DAWG010/THREEBODY  ↗</text>


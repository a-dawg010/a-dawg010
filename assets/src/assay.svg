<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 286" width="880" height="286" role="img" aria-label="assay — reconstructs which of your repositories have been sent to which AI vendor, and when, from records already on your Mac.">
<style>
__FONTS__
__VARS__
.card{fill:var(--card);stroke:var(--rule);stroke-width:1}

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 286" width="880" height="286" role="img" aria-label="assay — a scanner that finds the files and virtual machines coding agents leave behind, and reports how much space you can reclaim.">
<style>
__FONTS__
__VARS__
.card{fill:var(--card);stroke:var(--rule);stroke-width:1}
.eyebrow{font:500 10px var(--mono);fill:var(--faint);letter-spacing:2.2px}
.name{font:800 40px var(--disp);fill:var(--ink);letter-spacing:-1.5px}
.tag{font:italic 400 19px var(--serif);fill:var(--ink)}
.body{font:500 13px var(--body);fill:var(--dim)}
.link{font:500 11px var(--mono);fill:var(--violet);letter-spacing:1.3px}
.tile{fill:var(--sunk);stroke:var(--rule);stroke-width:.9}
.num{font:800 30px var(--disp);fill:var(--ink);letter-spacing:-1px}
.unit{font:500 11px var(--mono);fill:var(--faint);letter-spacing:2px}
</style>
<defs>
  <clipPath id="cardclip"><rect x="24" y="14" width="832" height="258" rx="14"/></clipPath>
  <clipPath id="grid"><rect x="470" y="44" width="230" height="130"/></clipPath>
</defs>

<rect width="880" height="286" fill="var(--paper)"/>
<rect class="card" x="24" y="14" width="832" height="258" rx="14"/>
<g clip-path="url(#cardclip)"><rect x="24" y="14" width="5" height="258" fill="var(--yellow)"/></g>

<text class="eyebrow" x="58" y="54">01 &#160;·&#160; CLI &#160;·&#160; PYTHON</text>
<text class="name" x="56" y="98">assay</text>
<text class="tag" x="56" y="128">your agents are hoarders.</text>
<text class="body" x="56" y="164">Scans the machine for what Claude Code, Cursor,</text>
<text class="body" x="56" y="183">Codex and Antigravity left behind — orphaned files,</text>
<text class="body" x="56" y="202">dead VMs, caches nobody claims. You decide what dies.</text>
<text class="link" x="56" y="238">GITHUB.COM/A-DAWG010/ASSAY  ↗</text>


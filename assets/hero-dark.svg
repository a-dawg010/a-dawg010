<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" role="img" aria-label="Ameya Panse — AI engineer. A query enters an orchestrator, routes through specialist sub-agents, and resolves into a grounded answer.">
<style>
:root{--mono:ui-monospace,SFMono-Regular,'SF Mono','JetBrains Mono',Menlo,Consolas,monospace;--bg:#0B0E13;--bg2:#111720;--bg3:#161E29;--grid:#1B2532;--stroke:#26303D;--stroke2:#33404F;--text:#E6EDF3;--dim:#93A1B1;--faint:#61707F;--accent:#2DD4BF;--accent2:#7DD3FC;--warn:#F59E0B;--vio:#A78BFA;--glow:0.10;}
.bg{fill:var(--bg)}
.dot{fill:var(--grid)}
.name{font:700 44px var(--mono);fill:var(--text);letter-spacing:1.6px}
.sub{font:500 15px var(--mono);fill:var(--dim);letter-spacing:.6px}
.meta{font:400 12px var(--mono);fill:var(--faint);letter-spacing:.9px}
.cap{font:600 10px var(--mono);fill:var(--faint);letter-spacing:2.2px}
.pill{font:600 11.5px var(--mono);fill:var(--accent);letter-spacing:1.3px}
.node{fill:var(--bg2);stroke:var(--stroke);stroke-width:1.25}
.nlab{font:600 13px var(--mono);fill:var(--text);letter-spacing:.7px}
.nsub{font:400 10px var(--mono);fill:var(--faint);letter-spacing:.3px}
.edge{fill:none;stroke:var(--stroke2);stroke-width:1.25}
.pkt{fill:var(--accent)}
.rule{stroke:var(--stroke);stroke-width:1}
.tick{font:500 14px var(--mono);fill:var(--dim)}
.tick tspan.k{fill:var(--accent)}
</style>
<defs>
  <pattern id="d" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1.2" cy="1.2" r="1" class="dot"/></pattern>
  <radialGradient id="halo" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="var(--accent)" stop-opacity="var(--glow)"/>
    <stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/>
  </radialGradient>
  <filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3.2"/></filter>

  <path id="eIn"  d="M176,258 L202,258"/>
  <path id="eR1"  d="M306,258 C322,258 320,180 336,180"/>
  <path id="eR2"  d="M306,258 C322,258 320,232 336,232"/>
  <path id="eR3"  d="M306,258 C322,258 320,284 336,284"/>
  <path id="eR4"  d="M306,258 C322,258 320,336 336,336"/>
  <path id="eA1"  d="M562,180 C578,180 576,258 592,258"/>
  <path id="eA2"  d="M562,232 C578,232 576,258 592,258"/>
  <path id="eA3"  d="M562,284 C578,284 576,258 592,258"/>
  <path id="eA4"  d="M562,336 C578,336 576,258 592,258"/>
  <path id="eOut" d="M696,258 L722,258"/>

  <clipPath id="typeclip"><rect x="30" y="374" width="0" height="22">
    <animate attributeName="width" dur="9s" repeatCount="indefinite" calcMode="linear"
      values="0;0;624;624;624" keyTimes="0;0.035;0.34;0.94;1"/>
  </rect></clipPath>
</defs>

<rect class="bg" width="880" height="420"/>
<rect width="880" height="420" fill="url(#d)"/>
<ellipse cx="450" cy="262" rx="430" ry="150" fill="url(#halo)"/>

<!-- identity -->
<text class="name" x="36" y="66">AMEYA PANSE</text>
<text class="sub" x="38" y="92">AI ENGINEER · AGENTIC SYSTEMS / GRAPH-RAG / AUTOMOTIVE SECURITY</text>
<text class="meta" x="38" y="112">3+ YRS · PUNE, IN · LANGGRAPH · NEO4J · FASTAPI · AWS · ISO/SAE 21434</text>

<g>
  <rect x="654" y="45" width="190" height="27" rx="13.5" fill="var(--bg2)" stroke="var(--accent)" stroke-opacity=".45"/>
  <circle cx="672" cy="58.5" r="3.4" fill="var(--accent)">
    <animate attributeName="opacity" dur="2.4s" repeatCount="indefinite" values="1;.25;1" keyTimes="0;.5;1"/>
  </circle>
  <circle cx="672" cy="58.5" r="3.4" fill="var(--accent)" filter="url(#soft)">
    <animate attributeName="r" dur="2.4s" repeatCount="indefinite" values="3.4;9;3.4" keyTimes="0;.5;1"/>
    <animate attributeName="opacity" dur="2.4s" repeatCount="indefinite" values=".7;0;.7" keyTimes="0;.5;1"/>
  </circle>
  <text class="pill" x="685" y="62.5">OPEN TO CONVERSATIONS</text>
</g>

<line class="rule" x1="36" y1="128" x2="844" y2="128"/>

<!-- stage captions -->
<text class="cap" x="36"  y="150">INGEST</text>
<text class="cap" x="206" y="150">ROUTE</text>
<text class="cap" x="336" y="150">SPECIALIST SUB-AGENTS</text>
<text class="cap" x="592" y="150">SYNTHESIZE</text>
<text class="cap" x="722" y="150">RESPOND</text>

<!-- edges -->
<use href="#eIn" class="edge"/>
<use href="#eR1" class="edge"/><use href="#eR2" class="edge"/><use href="#eR3" class="edge"/><use href="#eR4" class="edge"/>
<use href="#eA1" class="edge"/><use href="#eA2" class="edge"/><use href="#eA3" class="edge"/><use href="#eA4" class="edge"/>
<use href="#eOut" class="edge"/>

<!-- query -->
<rect class="node" x="36" y="232" width="140" height="52" rx="7"/>
<text class="nlab" x="50" y="256">QUERY</text>
<text class="nsub" x="50" y="271">natural language</text>

<!-- router -->
<g>
  <polygon class="node" points="218,228 294,228 306,258 294,288 218,288 206,258"/>
  <polygon points="218,228 294,228 306,258 294,288 218,288 206,258" fill="none" stroke="var(--accent)" stroke-width="1.6" opacity="0">
    <animate attributeName="opacity" dur="9s" repeatCount="indefinite" calcMode="linear"
      values="0;0;1;1;0;0" keyTimes="0;0.095;0.115;0.175;0.20;1"/>
  </polygon>
  <text class="nlab" x="256" y="263" text-anchor="middle">ROUTER</text>
  <text class="nsub" x="256" y="306" text-anchor="middle">guardrails · hand-off</text>
</g>

<!-- agents -->
<g>
  <rect class="node" x="336" y="160" width="226" height="40" rx="6"/>
  <rect x="337.5" y="180" width="3" height="0" rx="1.5" fill="var(--accent)">
    <animate attributeName="height" dur="9s" repeatCount="indefinite" calcMode="linear" values="0;0;37;37;0;0" keyTimes="0;0.189;0.30;0.925;0.94;1"/>
    <animate attributeName="y" dur="9s" repeatCount="indefinite" calcMode="linear" values="180;180;161.5;161.5;180;180" keyTimes="0;0.189;0.30;0.925;0.94;1"/>
  </rect>
  <rect x="336" y="160" width="226" height="40" rx="6" fill="none" stroke="var(--accent)" stroke-width="1.4" opacity="0">
    <animate attributeName="opacity" dur="9s" repeatCount="indefinite" calcMode="linear" values="0;0;.85;.85;0;0" keyTimes="0;0.189;0.21;0.925;0.94;1"/>
  </rect>
  <text class="nlab" x="354" y="181">RETRIEVAL</text>
  <text class="nsub" x="354" y="194">graph-rag · neo4j · faiss</text>
</g>
<g>

  </rect>
  <text class="nlab" x="354" y="233">THREAT ANALYSIS</text>
  <text class="nsub" x="354" y="246">attack paths · mitre att&amp;ck</text>
</g>
<g>
  <rect class="node" x="336" y="264" width="226" height="40" rx="6"/>
  <rect x="337.5" y="284" width="3" height="0" rx="1.5" fill="var(--accent)">
    <animate attributeName="height" dur="9s" repeatCount="indefinite" calcMode="linear" values="0;0;37;37;0;0" keyTimes="0;0.222;0.333;0.925;0.94;1"/>
    <animate attributeName="y" dur="9s" repeatCount="indefinite" calcMode="linear" values="284;284;265.5;265.5;284;284" keyTimes="0;0.222;0.333;0.925;0.94;1"/>
  </rect>
  <rect x="336" y="264" width="226" height="40" rx="6" fill="none" stroke="var(--accent)" stroke-width="1.4" opacity="0">

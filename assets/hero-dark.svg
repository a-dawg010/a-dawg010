  <animateMotion dur="9s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.395;0.449;1"><mpath href="#eA2"/></animateMotion>
</circle>
<circle class="pkt" r="3.6">
  <animate attributeName="opacity" dur="9s" repeatCount="indefinite" calcMode="linear" values="0;0;1;1;0;0" keyTimes="0;0.407;0.415;0.461;0.468;1"/>

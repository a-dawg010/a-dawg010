<circle class="pkt" r="4.2">
  <animate attributeName="opacity" dur="9s" repeatCount="indefinite" calcMode="linear" values="0;0;1;1;0;0" keyTimes="0;0.618;0.628;0.688;0.695;1"/>
  <animateMotion dur="9s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.622;0.692;1"><mpath href="#eOut"/></animateMotion>

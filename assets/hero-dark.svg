  <rect x="337.5" y="336" width="3" height="0" rx="1.5" fill="var(--vio)">
    <animate attributeName="height" dur="9s" repeatCount="indefinite" calcMode="linear" values="0;0;37;37;0;0" keyTimes="0;0.239;0.35;0.925;0.94;1"/>
    <animate attributeName="y" dur="9s" repeatCount="indefinite" calcMode="linear" values="336;336;317.5;317.5;336;336" keyTimes="0;0.239;0.35;0.925;0.94;1"/>
  </rect>
  <rect x="336" y="316" width="226" height="40" rx="6" fill="none" stroke="var(--vio)" stroke-width="1.4" opacity="0">
    <animate attributeName="opacity" dur="9s" repeatCount="indefinite" calcMode="linear" values="0;0;.85;.85;0;0" keyTimes="0;0.239;0.259;0.925;0.94;1"/>
  </rect>
  <text class="nlab" x="354" y="337">EXTRACTION</text>
  <text class="nsub" x="354" y="350">crf-ner · cves · assets</text>
</g>

<!-- synthesis -->
<g>
  <polygon class="node" points="604,228 680,228 692,258 680,288 604,288 592,258"/>
  <polygon points="604,228 680,228 692,258 680,288 604,288 592,258" fill="none" stroke="var(--accent)" stroke-width="1.6" opacity="0">
    <animate attributeName="opacity" dur="9s" repeatCount="indefinite" calcMode="linear" values="0;0;1;1;0;0" keyTimes="0;0.53;0.55;0.62;0.65;1"/>
  </polygon>
  <text class="nlab" x="642" y="263" text-anchor="middle">SYNTHESIS</text>
  <text class="nsub" x="642" y="306" text-anchor="middle">rank · reconcile · cite</text>
</g>

<!-- answer -->
<g>
  <rect class="node" x="722" y="232" width="122" height="52" rx="7"/>
  <rect x="722" y="232" width="122" height="52" rx="7" fill="none" stroke="var(--accent)" stroke-width="1.5" opacity="0">
    <animate attributeName="opacity" dur="9s" repeatCount="indefinite" calcMode="linear" values="0;0;.9;.9;0;0" keyTimes="0;0.695;0.72;0.925;0.94;1"/>
  </rect>
  <g opacity="0">
    <animate attributeName="opacity" dur="9s" repeatCount="indefinite" calcMode="linear" values="0;0;1;1;0;0" keyTimes="0;0.695;0.72;0.925;0.94;1"/>
    <text class="nlab" x="736" y="256" fill="var(--accent)">ANSWER</text>
    <text class="nsub" x="736" y="271">grounded · cited</text>
  </g>
  <g opacity="1">
    <animate attributeName="opacity" dur="9s" repeatCount="indefinite" calcMode="linear" values="1;1;0;0;1;1" keyTimes="0;0.695;0.72;0.925;0.94;1"/>
    <text class="nlab" x="736" y="256" fill="var(--faint)">ANSWER</text>
    <text class="nsub" x="736" y="271">pending</text>
  </g>
</g>


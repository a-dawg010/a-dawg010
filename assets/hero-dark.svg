  <rect x="337.5" y="232" width="3" height="0" rx="1.5" fill="var(--warn)">
    <animate attributeName="height" dur="9s" repeatCount="indefinite" calcMode="linear" values="0;0;37;37;0;0" keyTimes="0;0.206;0.317;0.925;0.94;1"/>
    <animate attributeName="y" dur="9s" repeatCount="indefinite" calcMode="linear" values="232;232;213.5;213.5;232;232" keyTimes="0;0.206;0.317;0.925;0.94;1"/>
  </rect>
  <rect x="336" y="212" width="226" height="40" rx="6" fill="none" stroke="var(--warn)" stroke-width="1.4" opacity="0">

  <animate attributeName="opacity" dur="9s" repeatCount="indefinite" calcMode="linear" values="0;1;1;0;0" keyTimes="0;0.032;0.093;0.098;1"/>
  <animateMotion dur="9s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.03;0.095;1"><mpath href="#eIn"/></animateMotion>
</circle>
<circle class="pkt" r="3.6">
  <animate attributeName="opacity" dur="9s" repeatCount="indefinite" calcMode="linear" values="0;0;1;1;0;0" keyTimes="0;0.118;0.126;0.183;0.19;1"/>
  <animateMotion dur="9s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.122;0.187;1"><mpath href="#eR1"/></animateMotion>
</circle>
<circle class="pkt" r="3.6" fill="var(--warn)">

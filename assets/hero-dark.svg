<!-- typed query ticker -->
<g clip-path="url(#typeclip)">
  <text class="tick" x="36" y="391"><tspan class="k">&gt;</tspan> which safety assets are reachable if the telematics ECU is compromised?</text>
</g>
<rect x="36" y="378" width="8" height="15" fill="var(--accent)">
  <animate attributeName="x" dur="9s" repeatCount="indefinite" calcMode="linear" values="36;36;660;660;36;36" keyTimes="0;0.035;0.34;0.94;0.945;1"/>

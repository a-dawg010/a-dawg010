<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 236" width="880" height="236" role="img" aria-label="Career timeline: SecureThings intern and associate engineer, founding engineer at Arkcore, AI engineer at Equations Work.">
<style>
:root{--mono:ui-monospace,SFMono-Regular,'SF Mono','JetBrains Mono',Menlo,Consolas,monospace;--bg:#0B0E13;--bg2:#111720;--bg3:#161E29;--grid:#1B2532;--stroke:#26303D;--stroke2:#33404F;--text:#E6EDF3;--dim:#93A1B1;--faint:#61707F;--accent:#2DD4BF;--accent2:#7DD3FC;--warn:#F59E0B;--vio:#A78BFA;--glow:0.10;}
.bg{fill:var(--bg)}
.role{font:600 14px var(--mono);fill:var(--text);letter-spacing:.4px}
.org{font:400 11.5px var(--mono);fill:var(--dim)}
.yr{font:600 10px var(--mono);fill:var(--faint);letter-spacing:1.6px}
.edu{font:400 11.5px var(--mono);fill:var(--faint)}
.gl{stroke:var(--grid);stroke-width:1;stroke-dasharray:2 4}
</style>
<defs>
  <clipPath id="bars">
    <rect x="40"  y="112" width="105" height="26" rx="5"/>
    <rect x="149" y="112" width="324" height="26" rx="5"/>
    <rect x="477" y="112" width="269" height="26" rx="5"/>
    <rect x="750" y="112" width="90"  height="26" rx="5"/>
  </clipPath>
  <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%"  stop-color="var(--text)" stop-opacity="0"/>
    <stop offset="50%" stop-color="var(--text)" stop-opacity="0.14"/>
    <stop offset="100%" stop-color="var(--text)" stop-opacity="0"/>
  </linearGradient>
</defs>
<rect class="bg" width="880" height="236"/>

<line class="gl" x1="40" y1="100" x2="40" y2="150"/>
<line class="gl" x1="258" y1="100" x2="258" y2="150"/>
<line class="gl" x1="477" y1="100" x2="477" y2="150"/>
<line class="gl" x1="695" y1="100" x2="695" y2="150"/>
<text class="yr" x="40" y="96">2023</text>
<text class="yr" x="258" y="96">2024</text>
<text class="yr" x="477" y="96">2025</text>
<text class="yr" x="695" y="96">2026</text>

<!-- above-rail labels -->
<g opacity="1"><animate attributeName="opacity" begin="0s" dur="2.2s" calcMode="linear" values="0;0;1;1" keyTimes="0;0.0682;0.3409;1" fill="freeze"/>
  <text class="role" x="40" y="56">Engineering Intern</text>
  <text class="org"  x="40" y="74">SecureThings · Jan – Jun 2023</text>
</g>
<g opacity="1"><animate attributeName="opacity" begin="0s" dur="2.2s" calcMode="linear" values="0;0;1;1" keyTimes="0;0.3409;0.6136;1" fill="freeze"/>
  <text class="role" x="477" y="56">Founding Engineer</text>
  <text class="org"  x="477" y="74">Arkcore · Jan 2025 – Mar 2026</text>
</g>
<!-- below-rail labels -->
<g opacity="1"><animate attributeName="opacity" begin="0s" dur="2.2s" calcMode="linear" values="0;0;1;1" keyTimes="0;0.2045;0.4773;1" fill="freeze"/>
  <text class="role" x="149" y="168">Associate Software Engineer</text>
  <text class="org"  x="149" y="186">SecureThings · Jul 2023 – Dec 2024</text>
</g>
<g opacity="1"><animate attributeName="opacity" begin="0s" dur="2.2s" calcMode="linear" values="0;0;1;1" keyTimes="0;0.4773;0.75;1" fill="freeze"/>
  <text class="role" x="840" y="168" text-anchor="end">AI Engineer</text>
  <text class="org"  x="840" y="186" text-anchor="end">Equations Work · Apr 2026 – present</text>
</g>

<!-- bars -->
<rect x="40" y="112" width="105" height="26" rx="5" fill="var(--bg3)" stroke="var(--stroke)">
  <animate attributeName="width" begin="0s" dur="2.2s" values="0;0;105;105" keyTimes="0;0.0455;0.2727;1" calcMode="spline" keySplines="0 0 1 1;.2 .8 .3 1;0 0 1 1" fill="freeze"/>
</rect>
<rect x="149" y="112" width="324" height="26" rx="5" fill="var(--bg3)" stroke="var(--stroke)">
  <animate attributeName="width" begin="0s" dur="2.2s" values="0;0;324;324" keyTimes="0;0.1818;0.5;1" calcMode="spline" keySplines="0 0 1 1;.2 .8 .3 1;0 0 1 1" fill="freeze"/>
</rect>
<rect x="477" y="112" width="269" height="26" rx="5" fill="var(--bg2)" stroke="var(--accent2)" stroke-opacity=".7">
  <animate attributeName="width" begin="0s" dur="2.2s" values="0;0;269;269" keyTimes="0;0.3182;0.6364;1" calcMode="spline" keySplines="0 0 1 1;.2 .8 .3 1;0 0 1 1" fill="freeze"/>
</rect>
<rect x="750" y="112" width="90" height="26" rx="5" fill="var(--bg2)" stroke="var(--accent)">
  <animate attributeName="width" begin="0s" dur="2.2s" values="0;0;90;90" keyTimes="0;0.4545;0.6818;1" calcMode="spline" keySplines="0 0 1 1;.2 .8 .3 1;0 0 1 1" fill="freeze"/>
</rect>

<g opacity="1"><animate attributeName="opacity" begin="0s" dur="2.2s" calcMode="linear" values="0;0;1;1" keyTimes="0;0.6364;0.9091;1" fill="freeze"/>
  <text class="yr" x="92"  y="129" text-anchor="middle">6 MO</text>
  <text class="yr" x="311" y="129" text-anchor="middle">18 MO</text>
  <text class="yr" x="611" y="129" text-anchor="middle">15 MO</text>
</g>
<g clip-path="url(#bars)">
  <rect x="-260" y="112" width="240" height="26" fill="url(#shine)">
    <animateTransform attributeName="transform" type="translate" begin="1.8s" dur="5s" repeatCount="indefinite"
      calcMode="linear" values="0,0;1180,0;1180,0" keyTimes="0;0.72;1"/>
  </rect>
</g>

<!-- now marker -->
<g opacity="1"><animate attributeName="opacity" begin="0s" dur="2.2s" calcMode="linear" values="0;0;1;1" keyTimes="0;0.6818;0.9091;1" fill="freeze"/>
  <circle cx="840" cy="125" r="4" fill="var(--accent)"/>
  <circle cx="840" cy="125" r="4" fill="none" stroke="var(--accent)" stroke-width="1.2">
    <animate attributeName="r" dur="2.6s" repeatCount="indefinite" values="4;13;13" keyTimes="0;.7;1"/>
    <animate attributeName="opacity" dur="2.6s" repeatCount="indefinite" values=".9;0;0" keyTimes="0;.7;1"/>
  </circle>
</g>

<line x1="40" y1="202" x2="840" y2="202" stroke="var(--grid)" stroke-width="1"/>
<text class="edu" x="40" y="220">MSc Scientific Computing · Savitribai Phule Pune University · GPA 9.45</text>
<text class="edu" x="840" y="220" text-anchor="end">ML Cert · E&amp;ICT Academy, IIT Roorkee</text>
</svg>

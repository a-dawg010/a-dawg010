<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" role="img" aria-label="Ameya Panse. I build AI systems that have to be right.">
<style>
:root{--mono:ui-monospace,SFMono-Regular,'SF Mono','JetBrains Mono',Menlo,Consolas,monospace;--sans:-apple-system,BlinkMacSystemFont,Inter,'Segoe UI',Helvetica,Arial,sans-serif;--bg:#FFFFFF;--bg2:#F6F8FA;--bg3:#EDF1F5;--grid:#E3E9EF;--stroke:#D3DBE3;--stroke2:#B9C4CF;--text:#0E1620;--dim:#55606C;--faint:#7D8996;--accent:#0D9488;--accent2:#0369A1;--warn:#B45309;--vio:#6D28D9;--glow:0.07;}
.bg{fill:var(--bg)}
.lab{font:500 11.5px var(--mono);fill:var(--faint);letter-spacing:2.6px}
.big{font:600 46px var(--sans);fill:var(--text);letter-spacing:-1.2px}
.sub{font:400 17px var(--sans);fill:var(--dim);letter-spacing:-.1px}
.ln{fill:none;stroke:var(--stroke2);stroke-width:1}
.dot{fill:var(--stroke2)}
.pk{fill:var(--accent)}
.st{font:500 11.5px var(--mono);fill:var(--faint);letter-spacing:1.6px}
</style>
<defs>
  <path id="a" d="M52,300 H300"/>
  <path id="b1" d="M300,300 C340,300 340,272 380,272 H500 C540,272 540,300 580,300"/>
  <path id="b2" d="M300,300 H580"/>
  <path id="b3" d="M300,300 C340,300 340,328 380,328 H500 C540,328 540,300 580,300"/>
  <path id="c" d="M580,300 H828"/>
  <filter id="g" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="2.4"/></filter>
</defs>
<rect class="bg" width="880" height="380"/>

<text class="lab" x="52" y="60">AMEYA PANSE  ·  AI ENGINEER  ·  PUNE</text>

<text class="big" x="50" y="140">I build AI systems</text>
<text class="big" x="50" y="192">that have to be right.</text>
<text class="sub" x="52" y="232">Agents that decide before they act. Retrieval that knows how facts connect.</text>

<!-- the signal line -->
<use href="#a" class="ln"/><use href="#b1" class="ln"/><use href="#b2" class="ln"/><use href="#b3" class="ln"/><use href="#c" class="ln"/>
<circle class="dot" cx="52" cy="300" r="3"/>
<circle class="dot" cx="828" cy="300" r="3"/>
<circle class="dot" cx="300" cy="300" r="2"/>
<circle class="dot" cx="580" cy="300" r="2"/>

<g>
  <circle class="pk" r="3.2" filter="url(#g)" opacity=".9">
    <animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.04;0.30;1"><mpath href="#a"/></animateMotion>
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="linear" values="0;0;.9;.9;0;0" keyTimes="0;0.04;0.06;0.29;0.30;1"/>
  </circle>
  <circle class="pk" r="2.6">
    <animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.30;0.56;1"><mpath href="#b1"/></animateMotion>
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="linear" values="0;0;1;1;0;0" keyTimes="0;0.30;0.31;0.55;0.56;1"/>
  </circle>
  <circle class="pk" r="2.6">
    <animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.32;0.58;1"><mpath href="#b2"/></animateMotion>
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="linear" values="0;0;1;1;0;0" keyTimes="0;0.32;0.33;0.57;0.58;1"/>
  </circle>
  <circle class="pk" r="2.6">
    <animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.34;0.60;1"><mpath href="#b3"/></animateMotion>
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="linear" values="0;0;1;1;0;0" keyTimes="0;0.34;0.35;0.59;0.60;1"/>
  </circle>
  <circle class="pk" r="3.2" filter="url(#g)">
    <animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.60;0.86;1"><mpath href="#c"/></animateMotion>
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="linear" values="0;0;.9;.9;0;0" keyTimes="0;0.60;0.62;0.85;0.86;1"/>
  </circle>
  <circle class="pk" cx="828" cy="300" r="3" opacity="0">
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="linear" values="0;0;1;1;0;0" keyTimes="0;0.85;0.87;0.96;1;1"/>
  </circle>
</g>

<circle cx="55" cy="349" r="3" fill="var(--accent)">
  <animate attributeName="opacity" dur="3s" repeatCount="indefinite" values="1;.3;1" keyTimes="0;.5;1"/>
</circle>
<text class="st" x="68" y="353">OPEN TO CONVERSATIONS</text>
<text class="st" x="828" y="353" text-anchor="end">ENGINEER NOW  ·  FOUNDER NEXT</text>
</svg>
